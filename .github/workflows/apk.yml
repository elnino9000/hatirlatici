name: APK olustur
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Sabit imza anahtari
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore
      - name: Dosyalari yerlestir
        run: |
          if [ -f main.dart ]; then mkdir -p lib && mv main.dart lib/main.dart; fi
          flutter create --platforms=android --project-name hatirlatici --org com.hatirlatici .
      - name: Android ayarlari
        run: |
          python3 - <<'PY'
          import re, pathlib
          mp = pathlib.Path('android/app/src/main/AndroidManifest.xml')
          m = mp.read_text(encoding='utf-8')
          names = ['POST_NOTIFICATIONS','SCHEDULE_EXACT_ALARM','USE_EXACT_ALARM','RECEIVE_BOOT_COMPLETED','VIBRATE','USE_FULL_SCREEN_INTENT','WAKE_LOCK','RECORD_AUDIO','INTERNET','FOREGROUND_SERVICE','FOREGROUND_SERVICE_MEDIA_PLAYBACK']
          perms = ''.join('    <uses-permission android:name="android.permission.%s"/>\n' % p for p in names)
          q = '<intent><action android:name="android.speech.RecognitionService"/></intent>\n        <intent><action android:name="android.intent.action.TTS_SERVICE"/></intent>\n    '
          if '</queries>' in m:
              m = m.replace('</queries>', '    ' + q + '</queries>', 1)
          else:
              m = m.replace('<application', '<queries>\n        ' + q + '</queries>\n    <application', 1)
          m = m.replace('<application', perms + '    <application', 1)
          rec = '''
              <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver" />
              <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver">
                  <intent-filter>
                      <action android:name="android.intent.action.BOOT_COMPLETED"/>
                      <action android:name="android.intent.action.MY_PACKAGE_REPLACED"/>
                      <action android:name="android.intent.action.QUICKBOOT_POWERON"/>
                      <action android:name="com.htc.intent.action.QUICKBOOT_POWERON"/>
                  </intent-filter>
              </receiver>
              <receiver android:name=".HizliWidget" android:exported="true">
                  <intent-filter>
                      <action android:name="android.appwidget.action.APPWIDGET_UPDATE"/>
                  </intent-filter>
                  <meta-data android:name="android.appwidget.provider" android:resource="@xml/widget_hizli_info"/>
              </receiver>
              <receiver android:name=".NotWidget" android:exported="true">
                  <intent-filter>
                      <action android:name="android.appwidget.action.APPWIDGET_UPDATE"/>
                  </intent-filter>
                  <meta-data android:name="android.appwidget.provider" android:resource="@xml/widget_not_info"/>
              </receiver>
              <service android:name=".NotServis" android:exported="false" android:permission="android.permission.BIND_REMOTEVIEWS" />
          '''
          m = m.replace('</application>', rec + '</application>', 1)
          m = m.replace('<activity', '<activity android:showWhenLocked="true" android:turnScreenOn="true"', 1)
          m = re.sub(r'(<application[^>]*?android:label=")[^"]*(")', lambda mo: mo.group(1) + 'Hatırlatıcı' + mo.group(2), m, count=1, flags=re.S)
          mp.write_text(m, encoding='utf-8')
          for f in ['android/app/build.gradle.kts', 'android/app/build.gradle']:
              p = pathlib.Path(f)
              if not p.exists():
                  continue
              g = p.read_text(encoding='utf-8')
              kts = f.endswith('.kts')
              flag = 'isCoreLibraryDesugaringEnabled = true' if kts else 'coreLibraryDesugaringEnabled true'
              g = re.sub(r'compileOptions\s*\{', lambda mo: mo.group(0) + '\n        ' + flag + '\n', g, count=1)
              rflag = 'isMinifyEnabled = false\n            isShrinkResources = false' if kts else 'minifyEnabled false\n            shrinkResources false'
              g = re.sub(r'release\s*\{', lambda mo: mo.group(0) + '\n            ' + rflag, g, count=1)
              if kts:
                  g += '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n'
              else:
                  g += "\ndependencies {\n    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'\n}\n"
              p.write_text(g, encoding='utf-8')
              print('patched', f)
          PY
      - name: Uygulama simgesi
        run: |
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp icons/$d.png android/app/src/main/res/mipmap-$d/ic_launcher.png
          done
      - name: Widget dosyalari
        run: |
          d=android/app/src/main/kotlin/com/hatirlatici/hatirlatici
          mkdir -p $d
          cp android_ekler/MainActivity.kt $d/MainActivity.kt
          cp android_ekler/HizliWidget.kt $d/HizliWidget.kt
          cp android_ekler/NotWidget.kt $d/NotWidget.kt
          cp android_ekler/NotServis.kt $d/NotServis.kt
          find android/app/src/main -name 'MainActivity.java' -delete
          cp -r android_ekler/res/. android/app/src/main/res/
      - run: flutter pub get
      - run: flutter build apk --release --no-shrink --build-name=1.0.${{ github.run_number }} --build-number=${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: hatirlatici-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - name: Son surum olarak yayinla
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk hatirlatici.apk
          gh release delete son-surum --yes --cleanup-tag || true
          gh release create son-surum hatirlatici.apk \
            --target "$GITHUB_SHA" \
            --title "Hatırlatıcı (son sürüm 1.0.${{ github.run_number }})" \
            --notes "Telefondan indirip kur: hatirlatici.apk"
